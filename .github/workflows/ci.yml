name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Clean Architecture boundaries
        run: bash scripts/check_architecture.sh

      - name: Unit & widget tests with coverage
        run: flutter test --coverage

      # NFR-MNT-002: minimum 75% coverage of the domain layer (business logic).
      - name: Enforce domain-layer coverage >= 75%
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lcov
          lcov --extract coverage/lcov.info '*/domain/*' -o coverage/domain.info
          PCT=$(lcov --summary coverage/domain.info 2>&1 \
                | grep -oP 'lines\.*: \K[0-9.]+' | head -1)
          echo "Domain layer line coverage: ${PCT}%"
          awk -v p="${PCT:-0}" 'BEGIN { exit (p >= 75) ? 0 : 1 }' \
            || { echo "::error::Domain coverage ${PCT}% is below the 75% floor (NFR-MNT-002)."; exit 1; }

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

      # SRS §2.4: total app size MUST remain under 80 MB.
      - name: Check APK size budget
        run: |
          BYTES=$(stat -c%s build/app/outputs/flutter-apk/app-debug.apk)
          MB=$((BYTES / 1024 / 1024))
          echo "Debug APK: ${MB} MB"
          [ "$MB" -lt 150 ] || { echo "::error::Debug APK ${MB}MB — release budget is 80MB, investigate."; exit 1; }
