name: Release

# Pushing a tag like v1.0.0 builds the signed phone APKs and publishes them
# as a GitHub Release, which is how Moneyora is distributed outside a store
# (RELEASE.md). The same APKs go to the Samsung Galaxy Store by hand.
#
# A pull request that changes this file runs it as a dry run: everything but
# the signing and the publishing, so a broken release pipeline is found on
# the PR that broke it rather than on release day.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4

      # The tag names the version, pubspec.yaml holds it; a release whose
      # page says 1.0.1 while the app says 1.0.0 is a bug report waiting to
      # be filed. The build number after the "+" is Android's versionCode,
      # which must rise with every release or phones refuse the update.
      - name: The tag matches pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: version $version from pubspec.yaml."
            exit 0
          fi
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml's version $version. Tag v$version, or bump pubspec.yaml first."
            exit 1
          fi

      # The upload key comes from the repository's secrets and exists on the
      # runner only for this job. Without it the build would quietly sign
      # with the debug key (build.gradle.kts falls back to it so CI and fresh
      # clones build), and an APK signed with the debug key can never be
      # updated by one signed properly — so a real release refuses outright.
      - name: Install the upload key
        if: env.DRY_RUN != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret for $name is not set. RELEASE.md, 'GitHub Releases', says how."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # The two ABIs phones use. x86_64 is for emulators and Chromebooks. No
      # universal APK either: it gets a different versionCode from the split
      # ones, so a phone that installed one kind could not update to the
      # other. Retried like CI's build, for the same flaky downloads.
      - name: Build the phone APKs
        run: |
          delays=(15 60 180)
          for attempt in 1 2 3 4; do
            if flutter build apk --release --split-per-abi \
                --target-platform android-arm,android-arm64; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then break; fi
            delay=${delays[$((attempt - 1))]}
            echo "::warning::Build attempt $attempt failed, retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::The release build failed four times - not a transient fault"
          exit 1

      # The last guard against shipping the debug key: read the certificate
      # the APKs were actually signed with, not the configuration that was
      # meant to produce it.
      - name: Signed with the upload key, not the debug key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            cert=$("$apksigner" verify --print-certs "$apk" | grep 'certificate DN' | head -1)
            echo "$(basename "$apk"): $cert"
            if echo "$cert" | grep -q 'CN=Android Debug'; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "Dry run: debug-signed, as expected without the upload key."
              else
                echo "::error::$(basename "$apk") is signed with the debug key. Refusing to publish it."
                exit 1
              fi
            fi
          done

      # Named for what they are, with checksums, so someone installing from
      # a download link can confirm the file is the one published here.
      - name: Name the APKs and checksum them
        run: |
          mkdir -p dist
          v="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/moneyora-$v-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/moneyora-$v-armeabi-v7a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          cat > notes.md <<EOF
          ## Install

          1. Download **moneyora-$v-arm64-v8a.apk** below. It is right for
             almost every phone made since 2017. Only an older phone that
             refuses it needs **armeabi-v7a**.
          2. Open it. Android asks you to allow installs from your browser or
             file manager the first time; allow it, install, and you can turn
             the permission off again afterwards.
          3. To check the download, compare its SHA-256 with SHA256SUMS.txt.

          Moneyora keeps everything on your phone. See the
          [privacy policy](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/PRIVACY.md).
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Moneyora $v" \
            --notes-file notes.md \
            --verify-tag

      - name: Keep the dry run's APKs for inspection
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moneyora-dry-run
          path: dist/
          retention-days: 3

      # The runner is thrown away after the job, but the key should not
      # outlive the step that needed it even there.
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
