org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# One versionCode for both phone APKs: the build number after the "+" in
# pubspec.yaml. Without this, Flutter adds 1000 per ABI to it, so 1.2.0's
# arm64-v8a APK was 2005 and its armeabi-v7a APK 1005, and a phone that had
# the one refused the other as a downgrade: "App not installed", and the
# only way past that is an uninstall, which deletes every record. With one
# code, either APK updates any earlier install. The build number therefore
# starts above 2005 from 1.3.0 on (RELEASE.md).
force-version-code-ignoring-abi=true
