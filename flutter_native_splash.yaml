# Native splash config, run via `dart run flutter_native_splash:create`.
#
# NFR-PER-001, Sprint 4: the launch screen has to hold through the async
# window between process start and the home screen's first real frame — the
# `LaunchTheme` background alone is dropped the instant Flutter draws
# anything, spinner included. `FlutterNativeSplash.preserve`/`.remove` in
# `main.dart` is what keeps this showing instead of a flash of blank/white.
#
# No logo image: a solid brand fill, the colour of the launcher icon it
# follows (`assets/icons/`, drawn by `scripts/draw_icon.py`). An `image:`
# line pointing at `assets/icons/icon_foreground.png` would put the mark here
# too.
#
# Colours are `AppColors.light.brand` / `AppColors.dark.brand` — see E-01 on
# why indigo, not the SRS's green.
flutter_native_splash:
  color: "#3F51B5"
  color_dark: "#7986CB"

  android_12:
    color: "#3F51B5"
    color_dark: "#7986CB"

  android: true
  ios: true
